[package]
name = "tooldeck"
version = "0.1.0"
description = "Local-first macOS productivity workspace"
authors = ["Tooldeck contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tooldeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.1"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.23.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
